name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Target environment to deploy'
        type: choice
        options: ['none', 'staging', 'production']
        default: 'none'
      skip_tests:
        description: 'Skip test execution'
        type: boolean
        default: false

env:
  IMAGE_NAME: todos-service
  IMAGE_TAG: ${{ github.run_number }}
  NEXUS_URL: http://34.172.179.125:8081
  NEXUS_REPO: maven-snapshots
  NEXUS_DOCKER_REG: 34.172.179.125:8083
  STAGING_PORT: '9090'
  PRODUCTION_PORT: '8082'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false

jobs:

  build-and-test:
    name: Build & Test
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print build info
        run: echo "Branch:${{ github.ref_name }} | Commit:${{ github.sha }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & Test
        working-directory: todos-service
        run: |
          if [ "${{ inputs.skip_tests }}" = "true" ]; then
            mvn clean compile -B
          else
            mvn clean verify -B
          fi

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Results
          path: todos-service/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: todos-service/target/site/jacoco/
          if-no-files-found: ignore

  package-and-publish:
    name: Package & Publish
    runs-on: self-hosted
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package JAR
        working-directory: todos-service
        run: mvn package -DskipTests -B

      - name: Build Docker Image
        working-directory: todos-service
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -t ${{ env.IMAGE_NAME }}:latest .

      - name: Publish JAR to Nexus
        working-directory: todos-service
        run: |
          SETTINGS=$(mktemp)
          chmod 600 $SETTINGS
          cat > $SETTINGS <<XMLEOF
          <settings>
            <servers>
              <server>
                <id>nexus-releases</id>
                <username>${{ secrets.NEXUS_USER }}</username>
                <password>${{ secrets.NEXUS_PASS }}</password>
              </server>
            </servers>
          </settings>
          XMLEOF
          mvn deploy \
              -DskipTests \
              -DaltDeploymentRepository=nexus-releases::default::${{ env.NEXUS_URL }}/repository/${{ env.NEXUS_REPO }}/ \
              -s $SETTINGS -B
          rm -f $SETTINGS

      - name: Push Docker Image to Nexus
        run: |
          echo "${{ secrets.NEXUS_PASS }}" | docker login -u "${{ secrets.NEXUS_USER }}" --password-stdin ${{ env.NEXUS_DOCKER_REG }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.NEXUS_DOCKER_REG }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.NEXUS_DOCKER_REG }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.NEXUS_DOCKER_REG }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.NEXUS_DOCKER_REG }}/${{ env.IMAGE_NAME }}:latest

  deploy-staging:
    name: Deploy to Staging
    runs-on: self-hosted
    needs: package-and-publish
    steps:
      - name: Deploy to Staging
        run: |
          echo "=== Deploying to STAGING ==="
          docker stop ${{ env.IMAGE_NAME }}-staging || true
          docker rm ${{ env.IMAGE_NAME }}-staging || true
          docker run -d --name ${{ env.IMAGE_NAME }}-staging \
              -p ${{ env.STAGING_PORT }}:8080 \
              -e SPRING_PROFILES_ACTIVE=staging \
              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          echo "Staging deployment complete on port ${{ env.STAGING_PORT }}"

      - name: Smoke Tests
        run: |
          echo "=== Running Smoke Tests against Staging ==="
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${{ env.STAGING_PORT }}/health || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test PASSED"
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test FAILED - application did not respond with 200"
          exit 1

      - name: Teardown Staging
        if: always()
        run: docker rm -f ${{ env.IMAGE_NAME }}-staging || true

  deploy-production:
    name: Deploy to Production
    runs-on: self-hosted
    needs: deploy-staging
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "=== Deploying to PRODUCTION ==="
          docker stop ${{ env.IMAGE_NAME }}-prod || true
          docker rm ${{ env.IMAGE_NAME }}-prod || true
          docker run -d --name ${{ env.IMAGE_NAME }}-prod \
              -p ${{ env.PRODUCTION_PORT }}:8080 \
              -e SPRING_PROFILES_ACTIVE=production \
              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          echo "Production deployment complete on port ${{ env.PRODUCTION_PORT }}"

      - name: Tag Release
        run: |
          git tag -a "v${{ env.IMAGE_TAG }}" -m "Production release v${{ env.IMAGE_TAG }}"
          git push origin "v${{ env.IMAGE_TAG }}"

      - name: Rollback Info
        run: |
          echo "=== Rollback Plan ==="
          echo "If production deploy fails, run:"
          echo "  docker stop ${{ env.IMAGE_NAME }}-prod"
          echo "  docker rm ${{ env.IMAGE_NAME }}-prod"
          echo "  docker run -d --name ${{ env.IMAGE_NAME }}-prod -p ${{ env.PRODUCTION_PORT }}:8080 ${{ env.NEXUS_DOCKER_REG }}/${{ env.IMAGE_NAME }}:<PREVIOUS_TAG>"
          echo ""
          echo "Previous successful tags:"
          git tag -l 'v*' --sort=-version:refname | head -5

      - name: Build Summary
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║               BUILD SUMMARY DASHBOARD                     ║"
          echo "╠════════════════════════════════════════════════════════════╣"
          echo "║ Image       : ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "║ Branch      : ${{ github.ref_name }}"
          echo "║ Commit      : ${{ github.sha }}"
          echo "║ Run URL     : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "╠════════════════════════════════════════════════════════════╣"
          echo "║ ARTIFACTS"
          echo "║   JAR       : Nexus ${{ env.NEXUS_URL }}"
          echo "║   Image     : ${{ env.NEXUS_DOCKER_REG }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "╠════════════════════════════════════════════════════════════╣"
          echo "║ DEPLOYMENTS"
          echo "║   Staging   : http://localhost:${{ env.STAGING_PORT }}"
          echo "║   Production: http://localhost:${{ env.PRODUCTION_PORT }}"
          echo "╚════════════════════════════════════════════════════════════╝"

  cleanup:
    name: Cleanup
    runs-on: self-hosted
    needs: [deploy-production]
    if: always()
    steps:
      - name: Remove Docker Images
        run: |
          docker rmi ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.NEXUS_DOCKER_REG }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} || true
          docker rmi ${{ env.IMAGE_NAME }}:latest ${{ env.NEXUS_DOCKER_REG }}/${{ env.IMAGE_NAME }}:latest || true
